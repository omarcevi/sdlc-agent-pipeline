name: Paid run

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Kind of paid run
        type: choice
        options:
          - smoke
          - eval
          - bench
        default: smoke
      system:
        description: System (bench only)
        type: choice
        options:
          - multi
          - single
        default: multi
      preset:
        description: Model preset (bench only)
        type: choice
        options:
          - flash
          - pro
          - mixed
        default: flash
      tasks:
        description: Comma-separated task ids (bench only)
        type: string
        default: ''
      repeats:
        description: Repeats per task (bench only)
        type: string
        default: '1'
      accept_over_25:
        description: Accept a run count over 25
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paid
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.guard.outputs.tasks }}
      system: ${{ steps.guard.outputs.system }}
      preset: ${{ steps.guard.outputs.preset }}
      repeats: ${{ steps.guard.outputs.repeats }}
      runs: ${{ steps.guard.outputs.runs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: guard
        env:
          KIND: ${{ inputs.kind }}
          SYSTEM: ${{ inputs.system }}
          PRESET: ${{ inputs.preset }}
          TASKS: ${{ inputs.tasks }}
          REPEATS: ${{ inputs.repeats }}
          ACCEPT: ${{ inputs.accept_over_25 }}
          REF: ${{ github.ref }}
        run: |
          args=(--kind "$KIND" --ref "$REF")
          if [ "$KIND" = bench ]; then
            args+=(--system "$SYSTEM" --preset "$PRESET" --tasks "$TASKS" --repeats "$REPEATS")
          fi
          if [ "$ACCEPT" = true ]; then
            args+=(--accept-over-25)
          fi
          python scripts/ci_guard.py "${args[@]}"

  run:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.kind == 'bench' && 360 || 90 }}
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_GENAI_USE_VERTEXAI: 'true'
      ENVIRONMENT_BACKEND: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_RUNNER_SA }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked
      - run: uv tool install google-agents-cli==1.7.0
      - run: make sandbox-image
      - name: Bench run
        if: inputs.kind != 'eval'
        env:
          TASKS: ${{ needs.guard.outputs.tasks }}
          SYSTEM: ${{ needs.guard.outputs.system }}
          PRESET: ${{ needs.guard.outputs.preset }}
          REPEATS: ${{ needs.guard.outputs.repeats }}
          CONCURRENCY: ${{ inputs.kind == 'bench' && '2' || '1' }}
        run: uv run python -m bench.run --tasks "$TASKS" --system "$SYSTEM" --preset "$PRESET" --repeats "$REPEATS" --concurrency "$CONCURRENCY" --out results/ci
      - name: Smoke gate
        if: inputs.kind == 'smoke'
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob("results/ci/*.json"))
          if not files:
              sys.exit("smoke: no results file")
          rows = json.load(open(files[-1]))
          resolved = sum(1 for r in rows if r["resolved"])
          print(f"smoke: resolved {resolved}/{len(rows)}")
          if not (len(rows) == 3 and resolved >= 2):
              sys.exit("smoke: fewer than 2 of 3 rows resolved")
          PY
      - name: Eval
        if: inputs.kind == 'eval'
        run: make eval
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: paid-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/ci/**
            runs/*/record.json
          retention-days: 14
          if-no-files-found: warn
