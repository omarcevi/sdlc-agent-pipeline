name: Replay site

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'bench/replay_check.py'
      - '.github/workflows/pages.yaml'
  pull_request:
    paths:
      - 'web/**'
      - 'bench/replay_check.py'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Require the redaction secret
        if: github.event_name != 'pull_request'
        run: test -n "$REPLAY_REDACT" || { echo "REPLAY_REDACT is not set" >&2; exit 1; }
        env:
          REPLAY_REDACT: ${{ secrets.REPLAY_REDACT }}

      - name: Leak check
        run: python3 bench/replay_check.py web/public/replays
        env:
          REPLAY_REDACT: ${{ secrets.REPLAY_REDACT }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Typecheck, unit tests, build
        working-directory: web
        run: npm run typecheck && npm test && npm run build

      - name: End-to-end tests
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run e2e

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
