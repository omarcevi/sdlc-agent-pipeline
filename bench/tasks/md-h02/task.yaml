repo: mdlite
title: "Refactor: let the command line run on streams we pass in"
body: |
  We embed mdlite's command line in our own tool and call `mdlite.cli.main` directly.
  It always talks to the process's standard streams, so our tool swaps `sys.stdin`,
  `sys.stdout` and `sys.stderr` around every call, and our tests patch them too.

  Please let the caller hand the streams in:

      status = mdlite.cli.main(["-"], stdin=source, stdout=sink, stderr=log)

  - `stdin` is a binary stream, read when the file argument is `-`; `stdout` is a
    binary stream that receives the HTML; `stderr` is a text stream that receives
    every message `main` prints, including the usage message for wrong arguments.
  - Each of the three is optional. A stream that is not passed is the process's own,
    as today.

  This is a refactor: apart from where the output goes, nothing may change. The same
  bytes, the same messages and the same exit codes (wrong arguments still end in
  `SystemExit` with code 2), and `python -m mdlite` works exactly as before.
category: refactor
difficulty: medium
split: heldout
levers: [regression_risk]
