repo: mdlite
title: "Heading anchors run words together around a no-break space"
body: |
  Our French docs put a no-break space (U+00A0) between a number and its unit, and
  before `?`, `!` and `:`. Headings that contain one get anchors with the words glued
  together, so the links we write by hand (`#délai-de-10-jours`) go nowhere:

      >>> mdlite.to_html("## Délai de 10\u00a0jours")
      '<h2 id="délai-de-10jours">Délai de 10\xa0jours</h2>\n'
      >>> mdlite.toc("## Délai de 10\u00a0jours")
      [(2, 'Délai de 10\xa0jours', 'délai-de-10jours')]

  With an ordinary space the anchor is `délai-de-10-jours`, as we expect. A colleague
  says the same thing happens with a tab between two words of a heading.

  Expected: words separated by a no-break space, or by any other kind of space, stay
  separate in the anchor, just as they do with an ordinary space.
category: bug
difficulty: hard
split: heldout
levers: [distant_symptom, regression_risk]
